name: check-live
on:
  push:
    branches: [claude/project-thread-eq6qpf]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 24); do
            if curl -sS "https://neungseon.com/?t=$i" | grep -q 'jeojat.altolab.ai/embed.js'; then echo "script live after try $i"; break; fi
            sleep 10
          done
          for u in https://neungseon.com/ https://www.neungseon.com/ https://neungseon.com/jirisan.html; do
            echo "== $u"; curl -sS -L -D - -o /dev/null "$u" | grep -iE '^(HTTP|server|location|content-security-policy|x-frame-options)'
            echo -n "embed.js tags: "; curl -sS -L "$u" | grep -c 'jeojat.altolab.ai/embed.js'
          done
          echo "== embed.js"; curl -sS -D - -o /dev/null https://jeojat.altolab.ai/embed.js | grep -iE '^(HTTP|content-type)'
